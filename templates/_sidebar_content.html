<div class="sidebar-brand d-none d-md-flex">
    <span class="brand-icon">{% include "_pi_icon.html" %}</span>
    <span class="brand-text">4B I2C Admin</span>
</div>

<div class="sidebar-status">
    <div class="d-flex align-items-center gap-2 mb-1">
        <span class="status-dot status-dot-{{ 'on' if nav_status.state == 'running' else 'off' }}"></span>
        <strong>{{ 'Activo' if nav_status.state == 'running' else 'En espera' }}</strong>
    </div>
    <div class="sidebar-status-line"><i class="bi bi-cpu"></i> CPU {{ sidebar_hw.cpu }}%</div>
    <div class="sidebar-status-line"><i class="bi bi-memory"></i> RAM {{ sidebar_hw.ram }}%</div>
    <div class="sidebar-status-line"><i class="bi bi-hdd-network"></i> {{ nav_status.ip or '—' }}</div>
</div>

<div class="sidebar-section-label">Panel</div>
<nav class="sidebar-nav">
    <a href="{{ url_for('web.index') }}" class="{{ 'active' if request.endpoint == 'web.index' }}">
        <i class="bi bi-speedometer2"></i> Estado
    </a>
    <a href="{{ url_for('web.modules_list') }}" class="{{ 'active' if request.endpoint == 'web.modules_list' }}">
        <i class="bi bi-grid-3x3-gap"></i> Módulos
    </a>
    <a href="{{ url_for('web.playlist_editor') }}" class="{{ 'active' if request.endpoint == 'web.playlist_editor' }}">
        <i class="bi bi-list-ol"></i> Playlist
    </a>
</nav>
